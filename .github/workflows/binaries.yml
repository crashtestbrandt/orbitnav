name: binaries

# Build the extension for all three platforms whenever the Rust changes, and upload the results as
# workflow ARTIFACTS. It commits nothing.
#
# NO BINARY IS COMMITTED TO THIS REPOSITORY at all -- not on a push, not on a tag. `release.yml` commits
# a sha256 MANIFEST and attaches the bytes to the GitHub Release. This workflow is what keeps that safe:
# main is always PROVEN to build on every platform, even though nothing in the tree carries the result.
#
# Both descriptor profiles per platform, because they are different builds and only one of them is what a
# project running from source loads. See tools/build-native.sh.

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'tools/build-native.sh'
      - '.github/workflows/binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is what tools/build-native.sh is called with, and what
          # tools/check-descriptor-parity.sh looks for to prove every platform the script knows has a leg
          # that runs it.
          #
          # GITHUB-HOSTED, like every other job in this repository. A public addon should be buildable by
          # anyone who forks it, and a release that can only be cut on one person's hardware is a
          # single point of failure for a library other projects depend on.
          #
          # macos-latest is arm64. The dylib is still built universal -- tools/build-native.sh compiles
          # both architectures and lipos them -- because a single-arch dylib works on the machine that
          # built it and fails on the other half of the Mac install base.
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # The hosted images ship rustup, and native/rust-toolchain.toml pins the version -- rustup honours
      # it from inside that directory with no help from CI, installing 1.94.1 on first use. The action is
      # still used because it makes the install explicit and fails loudly if the pin cannot be resolved,
      # rather than surfacing later as a confusing build error.
      #
      # tools/build-native.sh adds its own cross targets (`rustup target add`) for the Windows msvc ABI
      # and for both macOS architectures, so nothing here needs to know about them.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build both descriptor profiles
        shell: bash
        run: tools/build-native.sh build ${{ matrix.platform }} staged

      - uses: actions/upload-artifact@v4
        with:
          name: orbitnav-${{ matrix.platform }}
          path: staged/
          retention-days: 30
