name: Claude PR review

# Runs an automatic Claude Code review when a pull request is OPENED (and not a draft) or when a DRAFT pr is
# marked READY FOR REVIEW. Drafts are skipped: GitHub fires `opened` for draft PRs too, so the job guards on
# `draft == false`; `ready_for_review` only ever fires for a non-draft, so it always passes the guard.
#
# REQUIRES a repository secret named CLAUDE_CODE_OAUTH_TOKEN (Settings -> Secrets and variables -> Actions ->
# New repository secret). Generate it with `claude setup-token` locally -- it bills against your Claude
# subscription. To use Anthropic API-credit billing instead, store a Console API key as the secret
# ANTHROPIC_API_KEY and swap the `claude_code_oauth_token:` line below for
# `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
#
# GITHUB-HOSTED, unlike the equivalent workflow in a private project. This repository is public, so a fork PR
# can rewrite this file -- and `pull_request` (not `pull_request_target`) means a fork's version runs with no
# secrets and a read-only token. The review simply does not run for fork PRs, which is the correct trade:
# a self-hosted runner would execute a stranger's workflow on your machine.

on:
  pull_request:
    types: [opened, ready_for_review]

# Don't pile up reviews if events arrive close together for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # `opened` also fires for draft PRs -- only review real (non-draft) ones. `ready_for_review` is non-draft by
    # definition, so it always passes this guard. The second clause skips fork PRs, where the secret is absent
    # and the job would fail on every one rather than being quietly inapplicable.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # One updatable comment instead of a new thread on each run.
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the working directory; read
            CONTRIBUTING.md first -- it is the authority on this repository -- then CLAUDE.md. Focus, in
            priority order, on:
            - Correctness: bugs, logic errors, unhandled edge cases, race and ordering hazards. Concurrency
              especially: this addon runs work on a pool, and the invariants are that a volume is an
              immutable snapshot, that a job carries the generation it was submitted under, and that no lock
              is held across a call back into the caller.
            - Project invariants (flag any violation):
              * `orbitnav-core` has an EMPTY [dependencies] table, never depends on `godot`, never sees a
                `Variant`, and never names a consumer's concepts (no stations, arenas, characters, issue
                numbers). An addon named for navigation must not accumulate decision code.
              * The facade boundary -- the backend class may be named ONLY in addons/orbitnav/nav.gd (the
                `just nav-check` gate). tools/orbitnav-smoke.sh is the one deliberate exception.
              * Byte-exactness -- parts of this crate reproduce another implementation's output exactly.
                Float WIDTH is load-bearing (real::Vec3 is f32; every widen/narrow is a named w()/n()), and
                iteration ORDER is load-bearing (component labels follow the linear seed scan; snap ties
                resolve to the first candidate in shell order). A "cleaner" rewrite of either is a defect.
                Quirks reproduced on purpose are marked QUIRK: -- do not suggest removing them.
              * One crossing per operation -- every boundary function takes or returns a WHOLE array. A
                per-element entry point is the specific mistake the design exists to prevent.
              * Strict GDScript typing in the facade and harness: every var/param/return explicitly typed,
                Array/Dictionary typed, no `as`-cast of a Variant (warnings are promoted to errors).
              * `forbid(unsafe_code)` in core, and `panic = "abort"` stays unset so a panicking worker is a
                failed job rather than a dead editor.
            - Whether new behaviour is covered where CONTRIBUTING.md says it belongs: pure logic in a Rust
              #[cfg(test)] module, consumer-visible behaviour in a harness suite. A suite that would pass
              with the extension absent is a defect.
            - Security implications and performance.

            Be concise and high-signal: only flag issues that genuinely matter; skip nits, style, and praise.
            If the change looks good, say so briefly. Use `gh pr comment` for a short top-level summary and
            `mcp__github_inline_comment__create_inline_comment` (with confirmed: true) for line-level
            findings. Only post GitHub comments -- do not return review text as a chat message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(tools/nav-check.sh),Bash(grep:*),Read,Glob,Grep"
