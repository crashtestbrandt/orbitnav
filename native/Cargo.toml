[workspace]
resolver = "2"
members = ["crates/orbitnav-core", "crates/orbitnav-godot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crashtestbrandt/orbitnav"
description = "OrbitNav — off-thread voxel navigation for Godot 4, in Rust"

[workspace.dependencies]
orbitnav-core = { path = "crates/orbitnav-core" }

# Release binaries ship inside a game export, so favour size + speed over build time.
#
# `panic = "abort"` is deliberately NOT set, for two reasons. gdext maps Rust panics onto Godot
# errors, and a GDExtension that aborts takes the whole editor with it. On top of that this crate
# runs work on a POOL: a panicking worker must become a failed job the caller can see and retry,
# not a dead process.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Local native-profiler runs use the same optimizer/LTO settings as shipping, but retain enough DWARF
# for perf/Hotspot/ETW to attribute OrbitNav frames to Rust functions and source lines. Published as
# a release asset and swapped in by a developer under a profile-only directory; shipping uses
# `[profile.release]` above. Nothing here is committed.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

# The build Godot loads whenever a project runs FROM SOURCE -- every CI gate, every probe, every
# editor run. It inherits `release`, so it is NOT the 10-50x slower cargo debug build: the optimizer
# settings, the strip and the debug level are all unchanged, and ONLY the checks differ.
#
# `debug-assertions` is what makes `debug_assert!` reachable at all. This crate's derive phases are
# gated on reproducing another implementation BYTE FOR BYTE, and the cheapest way to catch a
# divergence early is an assertion about an invariant the fast path takes on trust -- an index
# inside its array, a label already claimed, a heap key ordering.
#
# `overflow-checks` follows it. Cargo defaults it to the same value; it is stated rather than
# inherited so a future edit to one is a deliberate edit to both.
[profile.template-debug]
inherits = "release"
debug-assertions = true
overflow-checks = true
