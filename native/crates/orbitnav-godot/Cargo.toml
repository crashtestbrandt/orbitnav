[package]
name = "orbitnav-godot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OrbitNav — Godot 4 GDExtension binding"

[lib]
# The GDExtension itself. The name drives the shared-library filename referenced by
# addons/orbitnav_native/orbitnav.gdextension.
name = "orbitnav"
crate-type = ["cdylib"]

[dependencies]
orbitnav-core = { workspace = true }

# Built against the 4.4 API rather than 4.7. gdext extensions load in any Godot at or above the API
# they were built against, so a 4.4 baseline runs on any newer editor while staying usable by
# projects on older 4.x. It also avoids the `api-custom` feature, which would drag libclang/bindgen
# into every dev environment for no benefit here.
#
# Pinned exactly, not with a caret: gdext is 0.x and its API moves between releases. Both of this
# author's addons carry the same exact pin, so a gdext bump is one decision rather than two.
godot = { version = "=0.5.4", features = ["api-4-4"] }
